<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI brain microphone">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a122b"/>
      <stop offset="100%" stop-color="#0f1f46"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#60a5fa" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Electronic brain outline -->
  <path d="M20 20c0-6 4-10 10-10h4c6 0 10 4 10 10v4c2 0 4 2 4 4v4c0 2-2 4-4 4v2c0 6-4 10-10 10h-4c-6 0-10-4-10-10v-2c-2 0-4-2-4-4v-4c0-2 2-4 4-4z"
        fill="none" stroke="url(#neon)" stroke-width="2.4" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Circuit links across the brain -->
  <path d="M22 24h6l4-4 4 4h6" fill="none" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M24 32h4l4-6 4 6h4" fill="none" stroke="url(#glow)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M24 40h6l2-4 2 4h6" fill="none" stroke="#c4d4ff" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="22" cy="24" r="1.6" fill="#7dd3fc"/>
  <circle cx="42" cy="24" r="1.6" fill="#a78bfa"/>
  <circle cx="32" cy="20" r="1.6" fill="#8b5cf6"/>
  <circle cx="24" cy="40" r="1.6" fill="#7dd3fc"/>
  <circle cx="40" cy="40" r="1.6" fill="#38bdf8"/>

  <!-- Microphone integrated at center -->
  <rect x="26" y="26" width="12" height="14" rx="6" fill="none" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="32" y1="40" x2="32" y2="46" stroke="url(#neon)" stroke-width="2" stroke-linecap="round"/>
  <rect x="28" y="46" width="8" height="3" rx="1.5" fill="#7dd3fc"/>
  <line x1="24" y1="47.5" x2="40" y2="47.5" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
</svg>
